<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle corner rounding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Ring (Konark Wheel Motif) -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="8 6" opacity="0.75" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.5" />

  <!-- 16 Sun Spokes of Konark -->
  <g stroke="url(#goldGrad)" stroke-width="3" opacity="0.8">
    <line x1="256" y1="88" x2="256" y2="424" />
    <line x1="88" y1="256" x2="424" y2="256" />
    <line x1="137" y1="137" x2="375" y2="375" />
    <line x1="137" y1="375" x2="375" y2="137" />
    <line x1="190" y1="98" x2="322" y2="414" />
    <line x1="322" y1="98" x2="190" y2="414" />
    <line x1="98" y1="190" x2="414" y2="322" />
    <line x1="98" y1="322" x2="414" y2="190" />
  </g>

  <!-- Inner Sacred Wheel Hub -->
  <circle cx="256" cy="256" r="76" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="5" filter="url(#glow)" />
  <circle cx="256" cy="256" r="64" fill="url(#amberGlow)" />

  <!-- Kalinga Temple Shikhara & Spire Silhouette -->
  <path d="M 256 195 L 268 215 L 272 232 L 274 252 L 278 278 L 284 300 L 228 300 L 234 278 L 238 252 L 240 232 L 244 215 Z" fill="#fef08a" />
  <!-- Kalasa / Amalaka crown -->
  <ellipse cx="256" cy="192" rx="9" ry="5" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5" />
  <path d="M 256 182 L 256 188" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
  <polygon points="256,178 253,184 259,184" fill="#fbbf24" />

  <!-- Sacred Trident / Trishul / Chakra element at peak -->
  <circle cx="256" cy="245" r="8" fill="#991b1b" stroke="#fef08a" stroke-width="2" />

  <!-- Modern Floating Compass / Travel Indicator -->
  <polygon points="256,220 262,242 256,238 250,242" fill="#ef4444" />
  <polygon points="256,270 262,248 256,252 250,248" fill="#e2e8f0" />

  <!-- Bottom Label Pill: UtkalSarathi -->
  <g transform="translate(0, 50)">
    <rect x="136" y="375" width="240" height="34" rx="17" fill="#0c0a09" stroke="#f59e0b" stroke-width="1.5" opacity="0.95" />
    <text x="256" y="398" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#fef08a" letter-spacing="3">UTKALSARATHI</text>
  </g>
</svg>
